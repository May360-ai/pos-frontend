<div class="container-fluid">
  <h1 class="mb-4">Dashboard</h1>

  <div class="row">
    <!-- Total Clientes -->
    <div class="col-md-6 col-lg-3 mb-4">
      <div class="card bg-primary text-white">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="card-title mb-0">Total Clientes</h6>
              <h2 class="mb-0">{{ clientCount$ | async }}</h2>
            </div>
            <i class="bi bi-people" style="font-size: 3rem; opacity: 0.3"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Total Productos -->
    <div class="col-md-6 col-lg-3 mb-4">
      <div class="card bg-success text-white">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="card-title mb-0">Total Productos</h6>
              <h2 class="mb-0">{{ productCount$ | async }}</h2>
            </div>
            <i class="bi bi-box" style="font-size: 3rem; opacity: 0.3"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Total Impuestos -->
    <div class="col-md-6 col-lg-3 mb-4">
      <div class="card bg-warning text-white">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="card-title mb-0">Total Impuestos</h6>
              <h2 class="mb-0">{{ taxCount$ | async }}</h2>
            </div>
            <i class="bi bi-percent" style="font-size: 3rem; opacity: 0.3"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Total Facturas -->
    <div class="col-md-6 col-lg-3 mb-4">
      <div class="card bg-info text-white">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="card-title mb-0">Total Facturas</h6>
              <h2 class="mb-0">{{ invoiceCount$ | async }}</h2>
            </div>
            <i class="bi bi-receipt" style="font-size: 3rem; opacity: 0.3"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Ingresos Totales -->
  <div class="row mt-4">
    <div class="col-12">
      <div class="card bg-danger text-white">
        <div class="card-body">
          <h6 class="card-title">Ingresos Totales</h6>
          <h2>${{ totalRevenue$ | async | number: '1.2-2' }}</h2>
        </div>
      </div>
    </div>
  </div>
</div>
